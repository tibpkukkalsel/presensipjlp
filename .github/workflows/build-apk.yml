name: Build Android APK (Presis)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Presis-BPKUK-Kalsel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presis-BPKUK-Kalsel-APK
          path: output-apk/Presis-BPKUK-Kalsel.apk
          retention-days: 30
